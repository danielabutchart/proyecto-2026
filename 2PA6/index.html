<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #4427a8;
            margin-bottom: 50px;
        }

        h2 {
            color: #4427a8;
            margin-top: 30px;
        }

        hr {
            border: none;
            border-top: 2px solid #4427a8;
            margin: 35px 0;
        }

        .grid {
            display: grid;
            gap: 5px;
            margin-top: 15px;
        }

        .grid div {
            background-color: #4930a3;
            min-height: 100px;
            border: 2px solid white;
        }

        .one-column {
            grid-template-columns: 1fr;
        }

        .two-columns {
            grid-template-columns: repeat(2, 1fr);
        }

        .three-columns {
            grid-template-columns: repeat(3, 1fr);
        }

        .four-columns {
            grid-template-columns: repeat(4, 1fr);
        }

        .two-rows {
            grid-template-rows: repeat(2, 100px);
        }

        .three-rows {
            grid-template-rows: repeat(3, 100px);
        }

        .four-rows {
            grid-template-rows: repeat(4, 100px);
        }

        .five-rows {
            grid-template-rows: repeat(5, 80px);
        }

        .six-rows {
            grid-template-rows: repeat(6, 70px);
        }

        .large-grid {
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 120px);
        }

        .small-grid {
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 80px);
        }

        .mosaic1 {
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 100px);
        }

        .mosaic1 .item1 {
            grid-column: 1 / 3;
        }

        .mosaic2 {
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 80px);
        }

        .mosaic2 .item1 {
            grid-column: 1 / 3;
        }

        .mosaic3 {
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 80px);
        }

        .mosaic3 .item1 {
            grid-column: 1 / 5;
        }

        .mosaic4 {
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 80px);
        }

        .mosaic4 .item1 {
            grid-column: 1 / 2;
        }

        .mosaic4 .item2 {
            grid-column: 2 / 3;
        }

        .mosaic4 .item3 {
            grid-column: 1 / 3;
        }

        .mosaic5 {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 80px);
        }

        .mosaic5 .item1 {
            grid-column: 1 / 3;
            grid-row: 1 / 2;
        }

        .mosaic5 .item2 {
            grid-column: 3 / 4;
            grid-row: 1 / 3;
        }

        .mosaic5 .item3 {
            grid-column: 1 / 3;
            grid-row: 2 / 4;
        }

        .mosaic6 {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 80px);
        }

        .mosaic6 .item1 {
            grid-column: 1 / 3;
            grid-row: 1 / 4;
        }

        .mosaic6 .item2 {
            grid-column: 3 / 4;
            grid-row: 1 / 2;
        }

        .mosaic6 .item3 {
            grid-column: 3 / 4;
            grid-row: 2 / 4;
        }


        /* ========================= */
        /* MOSAIC 7 */
        /* ========================= */

        .mosaic7 {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 80px);
        }

        .mosaic7 .item1 {
            grid-column: 1 / 3;
            grid-row: 1 / 2;
        }

        .mosaic7 .item2 {
            grid-column: 3 / 4;
            grid-row: 1 / 3;
        }

        .mosaic7 .item3 {
            grid-column: 1 / 2;
            grid-row: 2 / 4;
        }

        .mosaic7 .item4 {
            grid-column: 2 / 3;
            grid-row: 3 / 4;
        }

        .mosaic8 {
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 70px);
        }

        .mosaic8 .item1 {
            grid-column: 1 / 3;
            grid-row: 1 / 3;
        }

        .mosaic8 .item2 {
            grid-column: 3 / 4;
            grid-row: 1 / 2;
        }

        .mosaic8 .item3 {
            grid-column: 4 / 5;
            grid-row: 1 / 3;
        }

        .mosaic8 .item4 {
            grid-column: 3 / 4;
            grid-row: 2 / 4;
        }

        .mosaic8 .item5 {
            grid-column: 1 / 3;
            grid-row: 3 / 5;
        }

        .mosaic8 .item6 {
            grid-column: 3 / 5;
            grid-row: 4 / 5;
        }


    </style>
</head>

<body>

    <h1>GRID LAYOUT</h1>

    <h2>1 columna</h2>

    <div class="grid one-column">
        <div></div>
    </div>


    <hr>

    <h2>2 columnas</h2>

    <div class="grid two-columns">
        <div></div>
        <div></div>
    </div>


    <hr>

    <h2>3 columnas</h2>

    <div class="grid three-columns">
        <div></div>
        <div></div>
        <div></div>
    </div>


    <hr>

    <h2>4 columnas</h2>

    <div class="grid four-columns">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>


    <hr>

    <h2>2 filas</h2>

    <div class="grid two-rows">
        <div></div>
        <div></div>
    </div>


    <hr>

    <h2>3 filas</h2>

    <div class="grid three-rows">
        <div></div>
        <div></div>
        <div></div>
    </div>


    <hr>

    <h2>4 filas</h2>

    <div class="grid four-rows">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>


    <hr>

    <h2>5 filas</h2>

    <div class="grid five-rows">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>


    <hr>

    <h2>6 filas</h2>

    <div class="grid six-rows">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>


    <hr>

    <h2>Large grid</h2>

    <div class="grid large-grid">

        <div></div>
        <div></div>
        <div></div>
        <div></div>

    </div>


    <hr>

    <h2>Small grid</h2>

    <div class="grid small-grid">

        <div></div>
        <div></div>
        <div></div>
        <div></div>

        <div></div>
        <div></div>
        <div></div>
        <div></div>

        <div></div>
        <div></div>
        <div></div>
        <div></div>

        <div></div>
        <div></div>
        <div></div>
        <div></div>

    </div>


    <hr>
    <h2>Mosaic 1</h2>

    <div class="grid mosaic1">

        <div class="item1"></div>
        <div></div>
        <div></div>

    </div>


    <hr>

    <h2>Mosaic 2</h2>

    <div class="grid mosaic2">

        <div class="item1"></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>

    </div>


    <hr>

    <h2>Mosaic 3</h2>

    <div class="grid mosaic3">

        <div class="item1"></div>
        <div></div>
        <div></div>
        <div></div>

    </div>


    <hr>

    <h2>Mosaic 4</h2>

    <div class="grid mosaic4">

        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
        <div></div>

    </div>


    <hr>

    <h2>Mosaic 5</h2>

    <div class="grid mosaic5">

        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
        <div></div>
        <div></div>

    </div>


    <hr>

    <h2>Mosaic 6</h2>

    <div class="grid mosaic6">

        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>

    </div>


    <hr>

    <h2>Mosaic 7</h2>

    <div class="grid mosaic7">

        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
        <div class="item4"></div>

    </div>


    <hr>

    <h2>Mosaic 8</h2>

    <div class="grid mosaic8">

        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
        <div class="item4"></div>
        <div class="item5"></div>
        <div class="item6"></div>

    </div>

</body>

</html>
